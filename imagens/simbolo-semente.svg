<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sproutLeafL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9ebd46"/>
      <stop offset="100%" stop-color="#79962e"/>
    </linearGradient>
    <linearGradient id="sproutLeafR" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9ebd46"/>
      <stop offset="100%" stop-color="#79962e"/>
    </linearGradient>
    <linearGradient id="sproutSoil" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b87532"/>
      <stop offset="60%" stop-color="#995c22"/>
      <stop offset="100%" stop-color="#774213"/>
    </linearGradient>
  </defs>

  <!-- Left Leaf -->
  <path d="M 252 260 
           C 228 232, 108 212, 98 128 
           C 152 120, 230 165, 252 260 Z" 
        fill="url(#sproutLeafL)" 
        stroke="#5d7620" 
        stroke-width="6" 
        stroke-linejoin="round"/>
  <!-- Left Leaf Vein -->
  <path d="M 248 252 C 205 205, 150 170, 112 142" 
        fill="none" 
        stroke="#5d7620" 
        stroke-width="5" 
        stroke-linecap="round"/>

  <!-- Right Leaf -->
  <path d="M 260 260 
           C 284 232, 404 212, 414 128 
           C 360 120, 282 165, 260 260 Z" 
        fill="url(#sproutLeafR)" 
        stroke="#5d7620" 
        stroke-width="6" 
        stroke-linejoin="round"/>
  <!-- Right Leaf Vein -->
  <path d="M 264 252 C 307 205, 362 170, 400 142" 
        fill="none" 
        stroke="#5d7620" 
        stroke-width="5" 
        stroke-linecap="round"/>

  <!-- Central Stem -->
  <path d="M 256 345 L 256 275 C 256 265, 252 258, 250 252 M 256 275 C 256 265, 260 258, 262 252" 
        fill="none" 
        stroke="#78952c" 
        stroke-width="13" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Soil Mound -->
  <path d="M 120 405 
           C 120 368, 168 355, 195 355 
           C 215 338, 245 334, 272 338 
           C 305 335, 332 348, 348 357 
           C 378 360, 392 382, 392 405 
           C 375 420, 140 420, 120 405 Z" 
        fill="url(#sproutSoil)" 
        stroke="#65370d" 
        stroke-width="6" 
        stroke-linejoin="round"/>

  <!-- Earth pebbles -->
  <ellipse cx="205" cy="385" rx="11" ry="8" fill="#6d3a0f" opacity="0.75"/>
  <ellipse cx="256" cy="368" rx="15" ry="10" fill="#c68846" opacity="0.6"/>
  <ellipse cx="310" cy="382" rx="12" ry="8.5" fill="#5a2e0a" opacity="0.8"/>
  <ellipse cx="352" cy="388" rx="9" ry="6.5" fill="#c68846" opacity="0.55"/>
</svg>